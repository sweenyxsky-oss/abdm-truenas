name: abdm
services:
  abdm:
    image: ghcr.io/sweenyxsky-oss/abdm-truenas:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Riyadh
      ABDM_API_HOST: 0.0.0.0
      ABDM_API_PORT: 15151
      ABDM_BROWSER_PORT: 15153
      ABDM_DOWNLOAD_FOLDER: /downloads
      # Optional: set a valid API key here to enable authentication on first boot.
      # ABDM_API_KEY: replace-with-a-secret-key
    ports:
      - "15151:15151"
      - "15153:15153"
    volumes:
      - /mnt/dataPool/abdm/config:/config
      - /mnt/dataPool/abdm/downloads:/downloads
      - /mnt/dataPool/abdm/temp:/temp
