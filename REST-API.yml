openapi: 3.0.0
info:
  title: Download Service API
  version: 1.0.0
  description: API for managing downloads, queues, categories, schedules, browser access, and settings.
servers:
  - url: http://localhost:15151
    description: Default server running on port 15151

paths:
  /add:
    post:
      summary: Add a new download source
      requestBody:
        description: Data for adding a download source
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  link:
                    type: string
                    description: The link to the download source
                  headers:
                    type: object
                    additionalProperties:
                      type: string
                    description: Optional headers for the request
                  downloadPage:
                    type: string
                    description: Optional download page URL
      responses:
        "200":
          description: Successfully added the download
          content:
            text/plain:
              schema:
                type: string
                description: OK on success

  /queues:
    get:
      summary: Get list of download queues
      responses:
        "200":
          description: List of download queues
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: The unique ID of the queue
                    name:
                      type: string
                      description: The name of the queue
  /start-headless-download:
    post:
      summary: Add a new download task
      requestBody:
        description: Data for adding a download task
        content:
          application/json:
            schema:
              type: object
              properties:
                downloadSource:
                  type: object
                  properties:
                    link:
                      type: string
                      description: The link to the download source
                    headers:
                      type: object
                      additionalProperties:
                        type: string
                      description: Optional headers for the request
                    downloadPage:
                      type: string
                      description: Optional download page URL
                folder:
                  type: string
                  description: Optional folder to save the download (Unix style path)
                name:
                  type: string
                  description: Optional name for the download task
                queueId:
                  type: integer
                  description: Optional queue ID to associate the task with
      responses:
        "200":
          description: Successfully added the download task
          content:
            text/plain:
              schema:
                type: string
                description: OK on success


  /ping:
    post:
      summary: Check whether the ABDM backend is alive
  /downloads:
    get:
      summary: List downloads
  /downloads/{id}/pause:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      summary: Pause a download
  /downloads/{id}/resume:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      summary: Resume a download
  /downloads/{id}/retry:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      summary: Reset and retry a download
  /downloads/{id}/remove:
    post:
      summary: Remove a download
      parameters:
        - name: removeFile
          in: query
          required: false
          schema:
            type: boolean
  /downloads/{id}/queue:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      summary: Assign a download to a queue
  /downloads/{id}/unqueue:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      summary: Remove a download from its queue
  /downloads/{id}/move:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      summary: Move a queued download
  /queues/{id}/start:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      summary: Start a queue
  /queues/{id}/stop:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      summary: Stop a queue
  /queues/{id}/delete:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      summary: Delete a queue
  /queues/{id}/rename:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      summary: Rename a queue
  /queues/{id}/concurrency:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      summary: Set queue concurrency
  /queues/{id}/schedule:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      summary: Configure queue scheduler
  /browser:
    get:
      summary: Browse the configured download folder
      parameters:
        - name: path
          in: query
          required: false
          schema:
            type: string
  /categories:
    get:
      summary: List categories
    post:
      summary: Create a category
  /categories/{id}/rename:
    post:
      summary: Rename a category
  /categories/{id}/delete:
    post:
      summary: Delete a custom category
  /settings:
    get:
      summary: Read ABDM service settings
    post:
      summary: Update ABDM service settings
