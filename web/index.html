<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ABDM TrueNAS</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">AB</div><div><strong>ABDM</strong><span>TrueNAS</span></div></div>
    <nav id="nav">
      <button class="nav-item active" data-page="dashboard">⌂ <span>Dashboard</span></button>
      <button class="nav-item" data-page="downloads">⇩ <span>Downloads</span></button>
      <button class="nav-item" data-page="queue">☷ <span>Queue</span></button>
      <button class="nav-item" data-page="browser">◫ <span>Browser</span></button>
      <button class="nav-item" data-page="categories">▦ <span>Categories</span></button>
      <button class="nav-item" data-page="scheduler">◷ <span>Scheduler</span></button>
      <button class="nav-item" data-page="settings">⚙ <span>Settings</span></button>
    </nav>
    <div class="sidebar-footer"><span class="status-dot"></span><span id="connection">Connecting…</span></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="topbar-left"><button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button><div><h1 id="page-title">Dashboard</h1><p id="page-subtitle">Download manager overview</p></div></div><div class="actions"><button class="secondary" id="importBtn">⇧ Import TXT</button><button class="primary" id="addBtn">＋ Add download</button></div></header>
    <section id="app"></section>
  </main>

  <dialog id="detailsDialog">
    <div class="dialog-head"><div><h2 id="detailsTitle">Download details</h2><p id="detailsSubtitle"></p></div><button class="icon-btn" onclick="document.getElementById('detailsDialog').close()">×</button></div>
    <div id="detailsBody"></div>
    <div class="dialog-actions"><button class="secondary" onclick="document.getElementById('detailsDialog').close()">Close</button><button class="primary" id="saveDetailsBtn">Save changes</button></div>
  </dialog>

  <dialog id="addDialog">
    <form method="dialog" id="addForm">
      <div class="dialog-head"><div><h2>Add download</h2><p>Paste one or more URLs to add them to ABDM.</p></div><button class="icon-btn" value="cancel">×</button></div>
      <label>URL(s)<textarea id="urlInput" rows="5" placeholder="https://example.com/file.zip"></textarea></label>
      <div class="form-grid"><label>Save to<input id="pathInput" value="/downloads"></label><label>Queue<select id="queueInput"><option value="">No queue</option></select></label><label>Category<select id="categoryInput"><option value="">Automatic</option></select></label></div>
      <div class="dialog-actions"><button class="secondary" value="cancel">Cancel</button><button class="primary" id="submitDownload" value="default">Add download</button></div>
    </form>
  </dialog>
  <dialog id="importDialog"><form method="dialog" id="importForm"><div class="dialog-head"><div><h2>Import download list</h2><p>Select a TXT file containing one URL per line.</p></div><button class="icon-btn" value="cancel">×</button></div><div style="padding:18px 20px"><input id="importFile" type="file" accept=".txt,text/plain"><div id="importPreview" style="margin-top:14px;max-height:45vh;overflow:auto"></div></div><div class="dialog-actions"><button class="secondary" value="cancel">Cancel</button><button class="primary" value="default">Start selected</button></div></form></dialog>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>document.getElementById("menuBtn").onclick=()=>document.querySelector(".sidebar").classList.toggle("open");document.getElementById("nav").addEventListener("click",()=>document.querySelector(".sidebar").classList.remove("open"));</script>
</body>
</html>
